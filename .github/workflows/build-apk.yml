name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version

          VERSION_LINE=$(java -version 2>&1 | head -n 1 || true)
          if [[ "$VERSION_LINE" =~ \"([0-9]+)(\.[0-9]+)? ]]; then
            RAW_MAJOR="${BASH_REMATCH[1]}"
            if [[ "$RAW_MAJOR" == "1" ]]; then
              if [[ "$VERSION_LINE" =~ \"1\.([0-9]+) ]]; then
                MAJOR="${BASH_REMATCH[1]}"
              else
                echo "ERROR: Unable to detect Java major version from: $VERSION_LINE" >&2
                exit 1
              fi
            else
              MAJOR="$RAW_MAJOR"
            fi
          else
            echo "ERROR: Unable to detect Java version from: $VERSION_LINE" >&2
            exit 1
          fi

          echo "Detected Java major version: $MAJOR"
          if (( MAJOR < 17 )); then
            echo "ERROR: Java 17 or newer is required, but detected Java $MAJOR." >&2
            exit 1
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYTOOL_BIN="keytool"
          if [[ -n "${JAVA_HOME:-}" && -x "${JAVA_HOME}/bin/keytool" ]]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          fi

          if [[ ! -f "./debug.keystore" ]]; then
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1 || {
                echo "ERROR: Failed to create temporary ./debug.keystore." >&2
                exit 1
              }
          fi

          if [[ ! -f "./debug.keystore" ]]; then
            echo "ERROR: ./debug.keystore was not found after generation." >&2
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -e "$APK_PATH" ]]; then
            echo "ERROR: Expected debug APK missing at $APK_PATH" >&2
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "Discovered APK files inside app/build/outputs/apk:" >&2
              find app/build/outputs/apk -type f -name "*.apk" >&2 || true
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

          if [[ ! -f "$APK_PATH" ]]; then
            echo "ERROR: $APK_PATH is not a regular file." >&2
            exit 1
          fi

          if [[ ! -s "$APK_PATH" ]]; then
            echo "ERROR: $APK_PATH is empty." >&2
            exit 1
          fi

          if [[ "$APK_PATH" != *.apk || "$APK_PATH" != "app/build/outputs/apk/debug/app-debug.apk" ]]; then
            echo "ERROR: Selected file does not match expected debug APK path: $APK_PATH" >&2
            exit 1
          fi

          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish debug APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK_PATH" || ! -s "$APK_PATH" ]]; then
            echo "ERROR: Expected debug APK missing or empty prior to release upload." >&2
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          TAG_NAME="debug-build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER} (${SHORT_SHA})"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Automated debug APK build from commit ${GITHUB_SHA}."
          fi
